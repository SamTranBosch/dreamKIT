apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdv-runtime-hackathon
  namespace: default
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: sdv-runtime-hackathon
  template:
    metadata:
      labels:
        app: sdv-runtime-hackathon
      annotations:
        restart-timestamp: "{{ .Values.timestamp | default now }}"
        pod.kubernetes.io/sandbox-cleanup: "force"
    spec:
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30  # Reduced from 60 for faster cleanup
      
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/network-unavailable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      # Enhanced init container with sandbox cleanup awareness
      initContainers:
      - name: setup-vss-hackathon
        image: ${DOCKER_HUB_NAMESPACE}/sdv-runtime:dc1f218806aa00e1a99df23c7e2ed387b0c6da70
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -e
          echo "Starting VSS initialization for hackathon runtime..."
          
          # Add delay to prevent rapid restart loops and allow cleanup
          echo "Brief system stabilization..."
          sleep 5
          
          echo "Initializing VSS file for hackathon (offline mode)..."
          mkdir -p /persistent /shared
          
          # Use separate directory for hackathon runtime
          if [ -f /persistent/vss-hackathon.json ]; then
            echo "Loading existing hackathon VSS file"
            cp /persistent/vss-hackathon.json /shared/vss-hackathon.json &
          elif [ -f /persistent/vss.json ]; then
            echo "Copying default VSS file for hackathon"
            cp /persistent/vss.json /shared/vss-hackathon.json &
          fi
          
          wait  # Wait for background copy
          chmod 666 /shared/vss-hackathon.json
          
          # Minimal final check
          sleep 2
          echo "VSS initialization complete for hackathon"
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        
        volumeMounts:
        - name: persistent-storage
          mountPath: /persistent
        - name: shared-vss-hackathon
          mountPath: /shared
      
      containers:
      - name: sdv-runtime-hackathon
        image: ${DOCKER_HUB_NAMESPACE}/sdv-runtime:dc1f218806aa00e1a99df23c7e2ed387b0c6da70
        imagePullPolicy: IfNotPresent
        
        # No startup probe for TCP since we're not hosting on 55555
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "pgrep -f 'sdv-runtime' || echo 'process check'"]
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 15
        
        # Process-based readiness probe instead of TCP
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "pgrep -f 'sdv-runtime' && test -f /home/dev/ws/vss.json"]
          initialDelaySeconds: 25
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Process-based liveness probe
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pgrep -f 'sdv-runtime' || echo 'process check'"]
          initialDelaySeconds: 35
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Increased resource requests for faster startup
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        
        env:
        - name: USER
          value: "${DK_USER}"
        - name: RUNTIME_NAME
          value: "IAA-Hackathon"
        - name: ARCH
          value: "${ARCH}"
        - name: OFFLINE_MODE
          value: "true"
        - name: DISABLE_DATABROKER
          value: "True"
        
        # No port configuration since we're not hosting
        
        volumeMounts:
        - name: shared-vss-hackathon
          mountPath: /home/dev/ws/vss.json
          subPath: vss-hackathon.json
      
      - name: vss-sync-hackathon
        image: ${DOCKER_HUB_NAMESPACE}/sdv-runtime:dc1f218806aa00e1a99df23c7e2ed387b0c6da70
        imagePullPolicy: IfNotPresent
        
        # Faster startup probe for vss-sync
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'vss-sync-hackathon startup'"]
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        
        # Faster readiness probe
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "test -f /shared/vss-hackathon.json"]
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        
        # Faster liveness probe
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pgrep -f 'vss-sync-hackathon' || echo 'process check'"]
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -e
          echo "Starting VSS sync service for hackathon (offline mode)..."
          
          # Add startup delay for stability
          sleep 3
          
          sync_file() {
            if [ -f /shared/vss-hackathon.json ]; then
              if ! cmp -s /shared/vss-hackathon.json /persistent/vss-hackathon.json 2>/dev/null; then
                echo "$(date): Hackathon VSS file changed, syncing"
                cp /shared/vss-hackathon.json /persistent/vss-hackathon.json
                sync
                echo "$(date): Hackathon sync completed"
              fi
            fi
          }
          
          # Initial sync with error handling
          echo "Performing initial VSS sync for hackathon..."
          sync_file || echo "Initial hackathon sync failed, continuing..."
          
          # Continuous monitoring with optimized intervals
          echo "Starting VSS monitoring for hackathon (5s intervals)..."
          while true; do
            sync_file || echo "Hackathon sync failed, continuing..."
            sleep 5
          done
        
        volumeMounts:
        - name: persistent-storage
          mountPath: /persistent
        - name: shared-vss-hackathon
          mountPath: /shared
        
        # Slightly increased resources for faster sync operations
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      
      volumes:
      - name: persistent-storage
        hostPath:
          path: /home/${DK_USER}/.dk/sdv-runtime
          type: DirectoryOrCreate
      - name: shared-vss-hackathon
        emptyDir: {}