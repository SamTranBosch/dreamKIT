apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdv-runtime
  namespace: default
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: sdv-runtime
  template:
    metadata:
      labels:
        app: sdv-runtime
      annotations:
        restart-timestamp: "{{ .Values.timestamp | default now }}"
        pod.kubernetes.io/sandbox-cleanup: "force"
    spec:
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30  # Reduced from 60 for faster cleanup
      
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/network-unavailable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      # Enhanced init container with sandbox cleanup awareness
      initContainers:
      - name: setup-vss
        image: ${DOCKER_HUB_NAMESPACE}/sdv-runtime:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -e
          echo "Starting VSS initialization with sandbox cleanup awareness..."
          
          # Add delay to prevent rapid restart loops and allow cleanup
          echo "Brief system stabilization..."
          sleep 5  # Reduced from 20
          
          echo "Initializing VSS file (offline mode)..."
          mkdir -p /persistent /shared
          
          # Parallel operations where possible
          if [ -f /persistent/vss.json ]; then
            echo "Loading existing VSS file"
            cp /persistent/vss.json /shared/vss.json &
          fi
          
          wait  # Wait for background copy
          chmod 666 /shared/vss.json
          
          # Minimal final check
          sleep 2  # Reduced from 5
          echo "VSS initialization complete"
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"  # Slightly increased for faster processing
          limits:
            memory: "64Mi"
            cpu: "200m"  # Increased limit for init speed
        
        volumeMounts:
        - name: persistent-storage
          mountPath: /persistent
        - name: shared-vss
          mountPath: /shared
      
      containers:
      - name: sdv-runtime
        image: ${DOCKER_HUB_NAMESPACE}/sdv-runtime:latest
        imagePullPolicy: IfNotPresent
        
        # Faster startup probe with more aggressive timing
        startupProbe:
          tcpSocket:
            port: 55555
          initialDelaySeconds: 20  # Reduced from 45
          periodSeconds: 5         # Reduced from 10
          timeoutSeconds: 3        # Reduced from 5
          failureThreshold: 15     # Increased to maintain total time but check faster
        
        # Faster readiness probe
        readinessProbe:
          tcpSocket:
            port: 55555
          initialDelaySeconds: 25  # Reduced from 60
          periodSeconds: 5         # Reduced from 15
          timeoutSeconds: 3        # Reduced from 10
          failureThreshold: 3
        
        # Optimized liveness probe
        livenessProbe:
          tcpSocket:
            port: 55555
          initialDelaySeconds: 35  # Reduced from 90
          periodSeconds: 15        # Reduced from 30
          timeoutSeconds: 5        # Reduced from 15
          failureThreshold: 3      # Reduced from 5 for faster detection
        
        # Increased resource requests for faster startup
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"  # Doubled for faster startup
          limits:
            memory: "512Mi"
            cpu: "1000m"  # Increased limit for peak performance
        
        env:
        - name: USER
          value: "${DK_USER}"
        - name: RUNTIME_NAME
          value: "${RUNTIME_NAME}"
        - name: ARCH
          value: "${ARCH}"
        - name: OFFLINE_MODE
          value: "true"
        
        ports:
        - containerPort: 55555
          hostPort: 55555
        
        volumeMounts:
        - name: shared-vss
          mountPath: /home/dev/ws/vss.json
          subPath: vss.json
      
      - name: vss-sync
        image: ${DOCKER_HUB_NAMESPACE}/sdv-runtime:latest
        imagePullPolicy: IfNotPresent
        
        # Faster startup probe for vss-sync
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'vss-sync startup'"]
          initialDelaySeconds: 10  # Reduced from 30
          periodSeconds: 5         # Reduced from 10
          timeoutSeconds: 2        # Reduced from 5
          failureThreshold: 6
        
        # Faster readiness probe
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "test -f /shared/vss.json"]
          initialDelaySeconds: 15  # Reduced from 45
          periodSeconds: 5         # Reduced from 15
          timeoutSeconds: 2        # Reduced from 5
          failureThreshold: 3
        
        # Faster liveness probe
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pgrep -f 'vss-sync' || echo 'process check'"]
          initialDelaySeconds: 20  # Reduced from 60
          periodSeconds: 15        # Reduced from 30
          timeoutSeconds: 5        # Reduced from 10
          failureThreshold: 3      # Reduced from 5
        
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -e
          echo "Starting VSS sync service (offline mode)..."
          
          # Add startup delay for stability
          sleep 3  # Reduced from 15
          
          sync_file() {
            if [ -f /shared/vss.json ]; then
              if ! cmp -s /shared/vss.json /persistent/vss.json 2>/dev/null; then
                echo "$(date): VSS file changed, syncing"
                cp /shared/vss.json /persistent/vss.json
                sync
                echo "$(date): Sync completed"
              fi
            fi
          }
          
          # Initial sync with error handling
          echo "Performing initial VSS sync..."
          sync_file || echo "Initial sync failed, continuing..."
          
          # Continuous monitoring with optimized intervals
          echo "Starting VSS monitoring (5s intervals)..."
          while true; do
            sync_file || echo "Sync failed, continuing..."
            sleep 5  # Reduced from 10 for more responsive sync
          done
        
        volumeMounts:
        - name: persistent-storage
          mountPath: /persistent
        - name: shared-vss
          mountPath: /shared
        
        # Slightly increased resources for faster sync operations
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"   # Doubled for faster sync
          limits:
            memory: "64Mi"
            cpu: "200m"  # Doubled limit
      
      volumes:
      - name: persistent-storage
        hostPath:
          path: /home/${DK_USER}/.dk/sdv-runtime
          type: DirectoryOrCreate
      - name: shared-vss
        emptyDir: {}