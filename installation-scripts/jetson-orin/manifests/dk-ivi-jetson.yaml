# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dk-ivi-service-account
  namespace: default
---
# ClusterRole with comprehensive permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dk-ivi-cluster-role
rules:
# Pod permissions
- apiGroups: [""]
  resources: ["pods", "pods/status", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Deployment permissions
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/status", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Service permissions
- apiGroups: [""]
  resources: ["services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Node permissions
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Events permissions
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dk-ivi-cluster-role-binding
subjects:
- kind: ServiceAccount
  name: dk-ivi-service-account
  namespace: default
roleRef:
  kind: ClusterRole
  name: dk-ivi-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
# Main Deployment with offline mode support
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dk-ivi
  namespace: default
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Prevents multiple instances running simultaneously
  selector:
    matchLabels:
      app: dk-ivi
  template:
    metadata:
      labels:
        app: dk-ivi
      annotations:
        restart-timestamp: "{{ .Values.timestamp | default now }}"
        pod.kubernetes.io/sandbox-cleanup: "force"
    spec:
      serviceAccountName: dk-ivi-service-account
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/network-unavailable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      
      # Enhanced init container with offline mode support
      initContainers:
      - name: wait-for-sdv-runtime
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c']
        args:
        - |
          set -e
          echo "=== DK-IVI Init Container with Offline Mode Support ==="
          echo "Timestamp: $(date)"
          
          # Function to check network connectivity
          check_network() {
            echo "Checking network connectivity..."
            
            # Check local network first
            if ping -c 1 -W 2 127.0.0.1 >/dev/null 2>&1; then
              echo "✓ Local network: OK"
            else
              echo "✗ Local network: FAILED"
              return 1
            fi
            
            # Check if we can reach k8s API server
            if timeout 5 wget -q --spider http://127.0.0.1:6443 2>/dev/null; then
              echo "✓ K8s API server reachable"
              return 0
            elif timeout 5 nc -z 127.0.0.1 6443 2>/dev/null; then
              echo "✓ K8s API server port accessible"
              return 0
            else
              echo "⚠ K8s API server not accessible"
              return 1
            fi
          }
          
          # Function to check kubectl availability and permissions
          check_kubectl() {
            echo "Checking kubectl availability..."
            
            # Try multiple kubectl locations
            KUBECTL_PATH=""
            for path in "/usr/local/bin/kubectl" "/usr/bin/kubectl" "/bin/kubectl"; do
              if [ -f "$path" ] && [ -x "$path" ]; then
                KUBECTL_PATH="$path"
                echo "✓ Found kubectl at: $path"
                break
              fi
            done
            
            if [ -z "$KUBECTL_PATH" ]; then
              echo "✗ kubectl not found in standard locations"
              return 1
            fi
            
            # Test kubectl functionality
            if timeout 10 $KUBECTL_PATH version --client >/dev/null 2>&1; then
              echo "✓ kubectl client working"
            else
              echo "✗ kubectl client failed"
              return 1
            fi
            
            # Test cluster connectivity
            if timeout 15 $KUBECTL_PATH cluster-info >/dev/null 2>&1; then
              echo "✓ kubectl cluster connectivity: OK"
              return 0
            else
              echo "⚠ kubectl cluster connectivity: FAILED"
              return 1
            fi
          }
          
          # Function to check using host kubectl via nsenter
          check_host_kubectl() {
            echo "Attempting to use host kubectl via nsenter..."
            
            # Install nsenter if not available
            if ! command -v nsenter >/dev/null 2>&1; then
              echo "Installing nsenter..."
              apk add --no-cache util-linux 2>/dev/null || {
                echo "⚠ Cannot install nsenter, skipping host kubectl method"
                return 1
              }
            fi
            
            # Test host kubectl access
            if timeout 10 nsenter -t 1 -m -p kubectl version --client >/dev/null 2>&1; then
              echo "✓ Host kubectl accessible via nsenter"
            else
              echo "✗ Host kubectl not accessible via nsenter"
              return 1
            fi
            
            # Test host kubectl cluster connectivity
            if timeout 15 nsenter -t 1 -m -p kubectl cluster-info >/dev/null 2>&1; then
              echo "✓ Host kubectl cluster connectivity: OK"
              return 0
            else
              echo "⚠ Host kubectl cluster connectivity: FAILED"
              return 1
            fi
          }
          
          # Function to wait for SDV runtime
          wait_for_sdv_runtime() {
            local kubectl_cmd="$1"
            echo "Searching for SDV Runtime deployment..."
            
            # Check multiple namespaces
            local namespaces="default kube-system sdv-system"
            local found_namespace=""
            
            for ns in $namespaces; do
              if timeout 10 $kubectl_cmd get deployment sdv-runtime -n "$ns" >/dev/null 2>&1; then
                found_namespace="$ns"
                echo "✓ Found SDV Runtime deployment in namespace: $ns"
                break
              fi
            done
            
            if [ -z "$found_namespace" ]; then
              echo "⚠ SDV Runtime deployment not found in any namespace"
              echo "Available deployments:"
              timeout 10 $kubectl_cmd get deployments --all-namespaces 2>/dev/null | head -10 || echo "Cannot list deployments"
              return 1
            fi
            
            # Wait for deployment to be available
            echo "Waiting for SDV Runtime deployment to be available..."
            if timeout 300 $kubectl_cmd wait --for=condition=available --timeout=300s deployment/sdv-runtime -n "$found_namespace"; then
              echo "✓ SDV Runtime deployment is available"
            else
              echo "⚠ SDV Runtime deployment not available within timeout"
              timeout 10 $kubectl_cmd describe deployment sdv-runtime -n "$found_namespace" 2>/dev/null || true
              return 1
            fi
            
            # Wait for pods to be ready
            echo "Waiting for SDV Runtime pods to be ready..."
            if timeout 180 $kubectl_cmd wait --for=condition=ready --timeout=180s pod -l app=sdv-runtime -n "$found_namespace"; then
              echo "✓ SDV Runtime pods are ready"
              timeout 10 $kubectl_cmd get pods -l app=sdv-runtime -n "$found_namespace" -o wide 2>/dev/null || true
              return 0
            else
              echo "⚠ SDV Runtime pods not ready within timeout"
              timeout 10 $kubectl_cmd get pods -l app=sdv-runtime -n "$found_namespace" -o wide 2>/dev/null || true
              return 1
            fi
          }
          
          # Main logic with offline mode support
          echo "Starting system initialization with offline mode support..."
          sleep 15  # Initial stabilization delay
          
          # Detect operational mode
          ONLINE_MODE=false
          KUBECTL_METHOD=""
          
          if check_network; then
            echo "=== ONLINE MODE DETECTED ==="
            ONLINE_MODE=true
            
            # Try ServiceAccount kubectl first
            if check_kubectl; then
              KUBECTL_METHOD="kubectl"
              echo "✓ Using ServiceAccount kubectl"
            # Fallback to host kubectl
            elif check_host_kubectl; then
              KUBECTL_METHOD="nsenter -t 1 -m -p kubectl"
              echo "✓ Using host kubectl via nsenter"
            else
              echo "⚠ No working kubectl method found, switching to offline mode"
              ONLINE_MODE=false
            fi
          else
            echo "=== OFFLINE MODE DETECTED ==="
            echo "Network connectivity issues detected, running in offline mode"
          fi
          
          # Execute based on mode
          if [ "$ONLINE_MODE" = "true" ] && [ -n "$KUBECTL_METHOD" ]; then
            echo "Attempting to wait for SDV Runtime..."
            if wait_for_sdv_runtime "$KUBECTL_METHOD"; then
              echo "✓ SDV Runtime dependency satisfied"
            else
              echo "⚠ SDV Runtime dependency not satisfied, but continuing..."
            fi
          else
            echo "=== OFFLINE MODE: Skipping SDV Runtime dependency check ==="
            echo "Running in standalone mode without external dependencies"
          fi
          
          # Final system stability check
          echo "Performing final system stability check..."
          sleep 10
          
          # Check critical host resources
          echo "Checking critical resources:"
          echo "- Docker socket: $([ -S /var/run/docker.sock ] && echo 'Available' || echo 'Not available')"
          echo "- X11 socket: $([ -d /tmp/.X11-unix ] && echo 'Available' || echo 'Not available')"
          echo "- DRI devices: $([ -d /dev/dri ] && echo 'Available' || echo 'Not available')"
          
          echo "=== Init container completed successfully ==="
          echo "Mode: $([ "$ONLINE_MODE" = "true" ] && echo 'ONLINE' || echo 'OFFLINE')"
          echo "kubectl method: ${KUBECTL_METHOD:-'None (offline mode)'}"
        
        securityContext:
          privileged: true  # Required for nsenter and system checks
        
        volumeMounts:
        # - name: host-proc
        #   mountPath: /host/proc
        #   readOnly: true
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      
      volumes:
      # - name: host-proc
      #   hostPath:
      #     path: /proc
      #     type: Directory
      - name: dk-home
        hostPath: 
          path: ${HOME_DIR}/.dk
          type: DirectoryOrCreate
      - name: x11-unix
        hostPath: 
          path: /tmp/.X11-unix
          type: Directory
      - name: kubectl-binary
        hostPath:
          path: /usr/local/bin/kubectl
          type: File
      - name: kube-config
        hostPath:
          path: ${HOME_DIR}/.kube/config
          type: File
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-binary
        hostPath:
          path: /usr/bin/docker
          type: File
      
      containers:
      - name: dk-ivi
        image: ${DOCKER_HUB_NAMESPACE}/dk_ivi:latest
        imagePullPolicy: IfNotPresent
        
        # Enhanced startup probe for sandbox issues
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'startup check' && sleep 2"]
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 12
        
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'ready'"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'alive'"]
          initialDelaySeconds: 120
          periodSeconds: 45
          timeoutSeconds: 15
          failureThreshold: 5
        
        # Resource limits to prevent resource exhaustion
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
        env:
        - name: DISPLAY
          value: "${DISPLAY}"
        - name: XDG_RUNTIME_DIR
          value: "${XDG_RUNTIME_DIR}"
        - name: QT_QUICK_BACKEND
          value: "software"
        - name: DKCODE
          value: "dreamKIT"
        - name: DK_USER
          value: "${DK_USER}"
        - name: DK_VIP
          value: "${dk_vip_demo}"
        - name: DK_DOCKER_HUB_NAMESPACE
          value: "${DOCKER_HUB_NAMESPACE}"
        - name: DK_ARCH
          value: "${ARCH}"
        - name: DK_CONTAINER_ROOT
          value: "/app/.dk/"
        - name: KUBECONFIG
          value: "/root/.kube/config"
        volumeMounts:
        - name: dk-home
          mountPath: /app/.dk
        - name: x11-unix
          mountPath: /tmp/.X11-unix
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: docker-binary
          mountPath: /usr/bin/docker
          readOnly: true
