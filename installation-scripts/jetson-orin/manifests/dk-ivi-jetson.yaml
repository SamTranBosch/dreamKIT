---
# ServiceAccount for dk-ivi
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dk-ivi-service-account
  namespace: default
automountServiceAccountToken: true

---
# ClusterRole with necessary permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dk-ivi-cluster-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding to bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dk-ivi-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dk-ivi-cluster-role
subjects:
- kind: ServiceAccount
  name: dk-ivi-service-account
  namespace: default

---
# Main Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dk-ivi
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dk-ivi
  template:
    metadata:
      labels:
        app: dk-ivi
    spec:
      serviceAccountName: dk-ivi-service-account
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      # Init container to wait for sdv-runtime
      initContainers:
      - name: wait-for-sdv-runtime
        # Use ARM64 compatible image or busybox for better compatibility
        image: busybox:latest
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c']
        args:
        - |
          set -e
          echo "Starting in offline mode on Jetson Orin - using local images only"
          echo "Architecture: $(uname -m)"
          
          # Wait for service account token to be properly mounted (Jetson Orin timing issue)
          echo "Waiting for service account token to be available..."
          for i in $(seq 1 30); do
            if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
              echo "Service account token found"
              break
            fi
            echo "Waiting for service account token... attempt $i/30"
            sleep 2
          done
          
          # Verify kubectl binary exists and is executable
          if [ ! -x /usr/local/bin/kubectl ]; then
            echo "Error: kubectl binary not found or not executable"
            ls -la /usr/local/bin/ || true
            exit 1
          fi
          
          # Set proper kubeconfig with explicit token
          export KUBECONFIG=/root/.kube/config
          
          # Test kubectl with explicit timeout and retry logic
          echo "Testing kubectl connectivity..."
          KUBECTL_SUCCESS=false
          for attempt in $(seq 1 10); do
            echo "Kubectl test attempt $attempt/10..."
            
            # Test basic connectivity first
            if timeout 15s /usr/local/bin/kubectl version --client >/dev/null 2>&1; then
              echo "Kubectl client working"
              
              # Test server connectivity
              if timeout 15s /usr/local/bin/kubectl get namespaces >/dev/null 2>&1; then
                echo "Kubectl server connectivity established"
                KUBECTL_SUCCESS=true
                break
              else
                echo "Server connectivity failed, retrying..."
              fi
            else
              echo "Kubectl client test failed, retrying..."
            fi
            
            sleep 5
          done
          
          if [ "$KUBECTL_SUCCESS" = "false" ]; then
            echo "Warning: kubectl connectivity failed after all attempts"
            echo "Continuing without kubectl checks..."
            echo "This might be due to RBAC timing issues on Jetson Orin"
            exit 0  # Continue anyway
          fi
          
          # Test permissions with explicit error handling
          echo "Testing RBAC permissions..."
          PERM_CHECK_SUCCESS=false
          for perm_attempt in $(seq 1 5); do
            echo "Permission check attempt $perm_attempt/5..."
            
            if timeout 10s /usr/local/bin/kubectl auth can-i get deployments 2>/dev/null; then
              echo "Deployment permissions: OK"
              if timeout 10s /usr/local/bin/kubectl auth can-i get pods 2>/dev/null; then
                echo "Pod permissions: OK"
                PERM_CHECK_SUCCESS=true
                break
              fi
            fi
            
            echo "Permission check failed, waiting for RBAC propagation..."
            sleep 3
          done
          
          if [ "$PERM_CHECK_SUCCESS" = "false" ]; then
            echo "Warning: RBAC permissions not ready, but continuing..."
            echo "This is common on Jetson Orin due to timing issues"
          fi
          
          # Check for sdv-runtime with robust error handling
          echo "Checking for sdv-runtime deployment..."
          SDV_FOUND=false
          for sdv_attempt in $(seq 1 5); do
            echo "SDV runtime check attempt $sdv_attempt/5..."
            
            if timeout 15s /usr/local/bin/kubectl get deployment sdv-runtime >/dev/null 2>&1; then
              echo "SDV Runtime deployment found"
              SDV_FOUND=true
              break
            else
              echo "SDV Runtime not found or not accessible, retrying..."
              sleep 3
            fi
          done
          
          if [ "$SDV_FOUND" = "true" ]; then
            echo "Waiting for SDV Runtime to be available..."
            
            # Custom wait logic with better error handling for Jetson Orin
            WAIT_SUCCESS=false
            for wait_attempt in $(seq 1 60); do
              echo "SDV Runtime readiness check $wait_attempt/60..."
              
              # Check deployment status
              READY_REPLICAS=$(/usr/local/bin/kubectl get deployment sdv-runtime -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
              DESIRED_REPLICAS=$(/usr/local/bin/kubectl get deployment sdv-runtime -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")
              
              if [ "$READY_REPLICAS" = "$DESIRED_REPLICAS" ] && [ "$READY_REPLICAS" != "0" ]; then
                echo "SDV Runtime deployment is ready ($READY_REPLICAS/$DESIRED_REPLICAS replicas)"
                
                # Check pod status
                POD_STATUS=$(/usr/local/bin/kubectl get pods -l app=sdv-runtime -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Unknown")
                if [ "$POD_STATUS" = "Running" ]; then
                  echo "SDV Runtime pod is running"
                  WAIT_SUCCESS=true
                  break
                fi
              fi
              
              if [ $wait_attempt -eq 60 ]; then
                echo "Timeout waiting for SDV Runtime, but continuing..."
                /usr/local/bin/kubectl describe deployment sdv-runtime || true
                /usr/local/bin/kubectl get pods -l app=sdv-runtime || true
                break
              fi
              
              sleep 5
            done
            
            if [ "$WAIT_SUCCESS" = "true" ]; then
              echo "SDV Runtime is fully ready"
            else
              echo "Warning: SDV Runtime readiness timeout, but continuing..."
            fi
          else
            echo "SDV Runtime deployment not found - this might be expected"
            echo "Continuing with IVI interface startup..."
          fi
          
          echo "Init container completed successfully on Jetson Orin"
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        
        volumeMounts:
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        # Mount service account token explicitly for Jetson Orin
        - name: service-account-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"  # Increased for Jetson Orin
            cpu: "200m"
        
        # Add environment variables for better debugging
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: "kubernetes.default.svc.cluster.local"
        - name: KUBERNETES_SERVICE_PORT
          value: "443"
      
      volumes:
      - name: dk-home
        hostPath: 
          path: ${HOME_DIR}/.dk
          type: DirectoryOrCreate
      - name: x11-unix
        hostPath: 
          path: /tmp/.X11-unix
          type: Directory
      - name: kubectl-binary
        hostPath:
          path: /usr/local/bin/kubectl
          type: File
      - name: kube-config
        hostPath:
          path: ${HOME_DIR}/.kube/config
          type: File
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-binary
        hostPath:
          path: /usr/bin/docker
          type: File
      # Explicitly mount service account token for Jetson Orin
      - name: service-account-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      
      containers:
      - name: dk-ivi
        image: ${DOCKER_HUB_NAMESPACE}/dk_ivi:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
        env:
        - name: DISPLAY
          value: "${DISPLAY}"
        - name: XDG_RUNTIME_DIR
          value: "${XDG_RUNTIME_DIR}"
        - name: QT_QUICK_BACKEND
          value: "software"
        - name: DKCODE
          value: "dreamKIT"
        - name: DK_USER
          value: "${DK_USER}"
        - name: DK_VIP
          value: "${dk_vip_demo}"
        - name: DK_DOCKER_HUB_NAMESPACE
          value: "${DOCKER_HUB_NAMESPACE}"
        - name: DK_ARCH
          value: "${ARCH}"
        - name: DK_CONTAINER_ROOT
          value: "/app/.dk/"
        - name: KUBECONFIG
          value: "/root/.kube/config"
        volumeMounts:
        - name: dk-home
          mountPath: /app/.dk
        - name: x11-unix
          mountPath: /tmp/.X11-unix
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: docker-binary
          mountPath: /usr/bin/docker
          readOnly: true
