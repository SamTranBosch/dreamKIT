# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dk-ivi-service-account
  namespace: default
---
# ClusterRole with comprehensive permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dk-ivi-cluster-role
rules:
# Pod permissions
- apiGroups: [""]
  resources: ["pods", "pods/status", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Deployment permissions
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/status", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Service permissions
- apiGroups: [""]
  resources: ["services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Node permissions
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Events permissions
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dk-ivi-cluster-role-binding
subjects:
- kind: ServiceAccount
  name: dk-ivi-service-account
  namespace: default
roleRef:
  kind: ClusterRole
  name: dk-ivi-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
# Main Deployment with SDV Runtime waiting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dk-ivi
  namespace: default
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Prevents multiple instances running simultaneously
  selector:
    matchLabels:
      app: dk-ivi
  template:
    metadata:
      labels:
        app: dk-ivi
      annotations:
        restart-timestamp: "{{ .Values.timestamp | default now }}"
        pod.kubernetes.io/sandbox-cleanup: "force"
    spec:
      serviceAccountName: dk-ivi-service-account
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/network-unavailable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      
      # Enhanced init container with proper SDV runtime waiting
      initContainers:
      - name: wait-for-sdv-runtime
        image: bitnami/kubectl:1.28
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c']
        args:
        - |
          set -e
          echo "=== DK-IVI Init Container Started ==="
          echo "Timestamp: $(date)"
          
          # Add initial delay for system stabilization
          echo "Waiting for system stabilization..."
          sleep 30
          
          # Test kubectl connectivity and permissions
          echo "Testing kubectl connectivity..."
          if kubectl version --client > /dev/null 2>&1; then
            echo "✓ kubectl client is working"
          else
            echo "✗ kubectl client issue detected"
            exit 1
          fi
          
          # Test cluster connectivity
          echo "Testing cluster connectivity..."
          if kubectl cluster-info > /dev/null 2>&1; then
            echo "✓ Cluster connectivity established"
          else
            echo "✗ Cannot connect to cluster"
            kubectl cluster-info || true
            exit 1
          fi
          
          # Test permissions
          echo "Testing RBAC permissions..."
          
          # Test deployment permissions
          if kubectl auth can-i get deployments; then
            echo "✓ Deployment read permissions: OK"
          else
            echo "✗ Deployment read permissions: FAILED"
            echo "Current permissions:"
            kubectl auth can-i --list || true
            exit 1
          fi
          
          # Test pod permissions
          if kubectl auth can-i get pods; then
            echo "✓ Pod read permissions: OK"
          else
            echo "✗ Pod read permissions: FAILED"
            exit 1
          fi
          
          # Check for SDV Runtime deployment
          echo "Searching for SDV Runtime deployment..."
          
          # First check in default namespace
          if kubectl get deployment sdv-runtime -n default > /dev/null 2>&1; then
            NAMESPACE="default"
            echo "✓ Found SDV Runtime deployment in namespace: $NAMESPACE"
          # Check in other common namespaces
          elif kubectl get deployment sdv-runtime -n kube-system > /dev/null 2>&1; then
            NAMESPACE="kube-system"
            echo "✓ Found SDV Runtime deployment in namespace: $NAMESPACE"
          elif kubectl get deployment sdv-runtime --all-namespaces > /dev/null 2>&1; then
            NAMESPACE=$(kubectl get deployment sdv-runtime --all-namespaces -o jsonpath='{.items[0].metadata.namespace}')
            echo "✓ Found SDV Runtime deployment in namespace: $NAMESPACE"
          else
            echo "⚠ SDV Runtime deployment not found in any namespace"
            echo "Available deployments:"
            kubectl get deployments --all-namespaces | grep -E "(NAME|sdv|runtime)" || true
            echo "Continuing without SDV Runtime dependency..."
            sleep 10
            echo "=== Init container completed (no SDV Runtime) ==="
            exit 0
          fi
          
          # Wait for SDV Runtime deployment to be available
          echo "Waiting for SDV Runtime deployment to be available..."
          if kubectl wait --for=condition=available --timeout=300s deployment/sdv-runtime -n $NAMESPACE; then
            echo "✓ SDV Runtime deployment is available"
          else
            echo "⚠ SDV Runtime deployment not available within timeout"
            echo "Deployment status:"
            kubectl describe deployment sdv-runtime -n $NAMESPACE || true
            echo "Continuing anyway..."
          fi
          
          # Wait for SDV Runtime pods to be ready
          echo "Waiting for SDV Runtime pods to be ready..."
          if kubectl wait --for=condition=ready --timeout=180s pod -l app=sdv-runtime -n $NAMESPACE; then
            echo "✓ SDV Runtime pods are ready"
            
            # Additional verification
            echo "SDV Runtime pod status:"
            kubectl get pods -l app=sdv-runtime -n $NAMESPACE -o wide
            
          else
            echo "⚠ SDV Runtime pods not ready within timeout"
            echo "Pod status:"
            kubectl get pods -l app=sdv-runtime -n $NAMESPACE -o wide || true
            echo "Pod descriptions:"
            kubectl describe pods -l app=sdv-runtime -n $NAMESPACE || true
            echo "Continuing anyway..."
          fi
          
          # Final system check
          echo "Performing final system stability check..."
          sleep 15
          
          echo "=== Init container completed successfully ==="
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      
      volumes:
      - name: dk-home
        hostPath: 
          path: ${HOME_DIR}/.dk
          type: DirectoryOrCreate
      - name: x11-unix
        hostPath: 
          path: /tmp/.X11-unix
          type: Directory
      - name: kubectl-binary
        hostPath:
          path: /usr/local/bin/kubectl
          type: File
      - name: kube-config
        hostPath:
          path: ${HOME_DIR}/.kube/config
          type: File
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-binary
        hostPath:
          path: /usr/bin/docker
          type: File
      
      containers:
      - name: dk-ivi
        image: ${DOCKER_HUB_NAMESPACE}/dk_ivi:latest
        imagePullPolicy: IfNotPresent
        
        # Enhanced startup probe for sandbox issues
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'startup check' && sleep 2"]
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 12
        
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'ready'"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'alive'"]
          initialDelaySeconds: 120
          periodSeconds: 45
          timeoutSeconds: 15
          failureThreshold: 5
        
        # Resource limits to prevent resource exhaustion
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
        env:
        - name: DISPLAY
          value: "${DISPLAY}"
        - name: XDG_RUNTIME_DIR
          value: "${XDG_RUNTIME_DIR}"
        - name: QT_QUICK_BACKEND
          value: "software"
        - name: DKCODE
          value: "dreamKIT"
        - name: DK_USER
          value: "${DK_USER}"
        - name: DK_VIP
          value: "${dk_vip_demo}"
        - name: DK_DOCKER_HUB_NAMESPACE
          value: "${DOCKER_HUB_NAMESPACE}"
        - name: DK_ARCH
          value: "${ARCH}"
        - name: DK_CONTAINER_ROOT
          value: "/app/.dk/"
        - name: KUBECONFIG
          value: "/root/.kube/config"
        volumeMounts:
        - name: dk-home
          mountPath: /app/.dk
        - name: x11-unix
          mountPath: /tmp/.X11-unix
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: docker-binary
          mountPath: /usr/bin/docker
          readOnly: true
