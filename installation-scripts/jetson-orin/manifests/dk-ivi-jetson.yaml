# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dk-ivi-service-account
  namespace: default
---
# ClusterRole with comprehensive permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dk-ivi-cluster-role
rules:
# Pod permissions
- apiGroups: [""]
  resources: ["pods", "pods/status", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Deployment permissions
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/status", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Service permissions
- apiGroups: [""]
  resources: ["services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Node permissions
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Events permissions
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dk-ivi-cluster-role-binding
subjects:
- kind: ServiceAccount
  name: dk-ivi-service-account
  namespace: default
roleRef:
  kind: ClusterRole
  name: dk-ivi-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
# Main Deployment with SDV Runtime waiting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dk-ivi
  namespace: default
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Prevents multiple instances running simultaneously
  selector:
    matchLabels:
      app: dk-ivi
  template:
    metadata:
      labels:
        app: dk-ivi
      annotations:
        restart-timestamp: "{{ .Values.timestamp | default now }}"
        pod.kubernetes.io/sandbox-cleanup: "force"
    spec:
      serviceAccountName: dk-ivi-service-account
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/network-unavailable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      
      # Enhanced init container with proper SDV runtime waiting
      initContainers:
      - name: wait-for-sdv-runtime
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c']
        args:
        - |
          set -e
          echo "=== Using Host kubectl via nsenter ==="
          
          # Execute kubectl on host namespace
          nsenter -t 1 -m -p kubectl get deployments > /dev/null 2>&1 || {
            echo "✗ Cannot access host kubectl"
            exit 1
          }
          
          echo "✓ Host kubectl access successful"
          
          # Check for SDV runtime using host kubectl
          if nsenter -t 1 -m -p kubectl get deployment sdv-runtime > /dev/null 2>&1; then
            echo "✓ Found SDV Runtime deployment"
            nsenter -t 1 -m -p kubectl wait --for=condition=available --timeout=300s deployment/sdv-runtime
            echo "✓ SDV Runtime is ready"
          else
            echo "⚠ SDV Runtime not found"
          fi
          
          echo "=== Init completed ==="
        
        securityContext:
          privileged: true  # Required for nsenter
        
        volumeMounts:
        # - name: host-proc
        #   mountPath: /host/proc
        #   readOnly: true
        - name: offline-tools
          mountPath: /host-bin
          readOnly: true
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      
      volumes:
      # - name: host-proc
      #   mountPath: /host/proc
      #   readOnly: true
      - name: offline-tools
        hostPath:
          path: /opt/k3s-tools/bin
          type: Directory
      - name: dk-home
        hostPath: 
          path: ${HOME_DIR}/.dk
          type: DirectoryOrCreate
      - name: x11-unix
        hostPath: 
          path: /tmp/.X11-unix
          type: Directory
      - name: kubectl-binary
        hostPath:
          path: /usr/local/bin/kubectl
          type: File
      - name: kube-config
        hostPath:
          path: ${HOME_DIR}/.kube/config
          type: File
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-binary
        hostPath:
          path: /usr/bin/docker
          type: File
      
      containers:
      - name: dk-ivi
        image: ${DOCKER_HUB_NAMESPACE}/dk_ivi:latest
        imagePullPolicy: IfNotPresent
        
        # Enhanced startup probe for sandbox issues
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'startup check' && sleep 2"]
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 12
        
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'ready'"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'alive'"]
          initialDelaySeconds: 120
          periodSeconds: 45
          timeoutSeconds: 15
          failureThreshold: 5
        
        # Resource limits to prevent resource exhaustion
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
        env:
        - name: DISPLAY
          value: "${DISPLAY}"
        - name: XDG_RUNTIME_DIR
          value: "${XDG_RUNTIME_DIR}"
        - name: QT_QUICK_BACKEND
          value: "software"
        - name: DKCODE
          value: "dreamKIT"
        - name: DK_USER
          value: "${DK_USER}"
        - name: DK_VIP
          value: "${dk_vip_demo}"
        - name: DK_DOCKER_HUB_NAMESPACE
          value: "${DOCKER_HUB_NAMESPACE}"
        - name: DK_ARCH
          value: "${ARCH}"
        - name: DK_CONTAINER_ROOT
          value: "/app/.dk/"
        - name: KUBECONFIG
          value: "/root/.kube/config"
        volumeMounts:
        - name: dk-home
          mountPath: /app/.dk
        - name: x11-unix
          mountPath: /tmp/.X11-unix
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: docker-binary
          mountPath: /usr/bin/docker
          readOnly: true
