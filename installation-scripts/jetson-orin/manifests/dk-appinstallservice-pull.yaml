apiVersion: batch/v1
kind: Job
metadata:
  name: dk-appinstallservice-pull
spec:
  template:
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: xip
      restartPolicy: Never
      containers:
      - name: dk-appinstallservice-pull
        image: ${DOCKER_HUB_NAMESPACE}/dk_appinstallservice:latest
        imagePullPolicy: Always
        command: ["true"]
