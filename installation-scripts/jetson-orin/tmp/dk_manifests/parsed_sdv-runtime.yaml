apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdv-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdv-runtime
  template:
    metadata:
      labels:
        app: sdv-runtime
    spec:
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: setup-vss
        image: ghcr.io/eclipse-autowrx/sdv-runtime:latest  # Same as main container
        imagePullPolicy: IfNotPresent  # Don't try to pull if exists
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "Initializing VSS file (offline mode)..."
          mkdir -p /persistent
          mkdir -p /shared
          
          # Load from persistent storage or create default
          if [ -f /persistent/vss.json ]; then
            echo "Loading existing VSS file from persistent storage"
            cp /persistent/vss.json /shared/vss.json
          fi
          
          chmod 666 /shared/vss.json
          echo "VSS initialization complete (offline)"
        volumeMounts:
        - name: persistent-storage
          mountPath: /persistent
        - name: shared-vss
          mountPath: /shared
      containers:
      - name: sdv-runtime
        image: ghcr.io/eclipse-autowrx/sdv-runtime:latest
        imagePullPolicy: IfNotPresent  # Critical for offline operation
        env:
        - name: USER
          value: "developer"
        - name: RUNTIME_NAME
          value: "dreamKIT-d21bb4a3"
        - name: ARCH
          value: "amd64"
        - name: OFFLINE_MODE
          value: "true"  # Signal to app it's running offline
        ports:
        - containerPort: 55555
          hostPort: 55555
        volumeMounts:
        - name: shared-vss
          mountPath: /home/dev/ws/vss.json
          subPath: vss.json
      
      - name: vss-sync
        image: ghcr.io/eclipse-autowrx/sdv-runtime:latest  # Same image
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "Starting VSS sync service (offline mode)..."
          
          sync_file() {
            if [ -f /shared/vss.json ]; then
              # Simple file comparison without external tools
              if ! cmp -s /shared/vss.json /persistent/vss.json 2>/dev/null; then
                echo "$(date): VSS file changed, syncing to persistent storage"
                cp /shared/vss.json /persistent/vss.json
                sync  # Force filesystem sync
                echo "$(date): Sync completed"
              fi
            fi
          }
          
          # Initial sync
          sync_file
          
          # Continuous monitoring with longer intervals for offline efficiency
          while true; do
            sync_file
            sleep 10  # Check every 10 seconds (adjust as needed)
          done
        volumeMounts:
        - name: persistent-storage
          mountPath: /persistent
        - name: shared-vss
          mountPath: /shared
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "50m"
      volumes:
      - name: persistent-storage
        hostPath:
          path: /home/developer/.dk/sdv-runtime
          type: DirectoryOrCreate
      - name: shared-vss
        emptyDir: {}
