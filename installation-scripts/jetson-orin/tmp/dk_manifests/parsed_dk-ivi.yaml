# Main Deployment with enhanced sandbox conflict prevention
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dk-ivi
  namespace: default
  # Add annotation to force new pod creation
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  # Enhanced strategy to prevent sandbox conflicts
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: dk-ivi
  template:
    metadata:
      labels:
        app: dk-ivi
      # Add unique annotation to force pod recreation
      annotations:
        restart-timestamp: "{{ .Values.timestamp | default now }}"
        pod.kubernetes.io/sandbox-cleanup: "force"
    spec:
      serviceAccountName: dk-ivi-service-account
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 60  # Increased for proper cleanup
      
      # Enhanced tolerations
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/network-unavailable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      
      # Enhanced init container with sandbox cleanup
      initContainers:
      - name: wait-for-sdv-runtime
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c']
        args:
        - |
          set -e
          echo "Starting sandbox cleanup and initialization..."
          
          # Add delay to prevent rapid restart loops and allow cleanup
          echo "Waiting for system stabilization..."
          sleep 30
          
          # Check for any existing containers with similar names and log them
          echo "Checking for container conflicts..."
          
          echo "Starting in offline mode - using local images only"
          echo "Checking kubectl permissions..."
          
          # Test permissions with timeout
          timeout 15s kubectl auth can-i get deployments || { 
            echo "Warning: No permission to get deployments, continuing anyway..."; 
          }
          timeout 15s kubectl auth can-i get pods || { 
            echo "Warning: No permission to get pods, continuing anyway..."; 
          }
          
          echo "Checking for sdv-runtime deployment..."
          if timeout 30s kubectl get deployment sdv-runtime >/dev/null 2>&1; then
            echo "SDV Runtime deployment found, waiting for it to be available..."
            
            if timeout 180s kubectl wait --for=condition=available --timeout=180s deployment/sdv-runtime; then
              echo "SDV Runtime deployment is available"
              
              echo "Waiting for sdv-runtime pod to be ready..."
              if timeout 120s kubectl wait --for=condition=ready --timeout=120s pod -l app=sdv-runtime; then
                echo "SDV Runtime pod is ready"
              else
                echo "Warning: SDV Runtime pod not ready, but continuing..."
                kubectl get pods -l app=sdv-runtime || true
              fi
            else
              echo "Warning: SDV Runtime deployment not available, but continuing..."
              kubectl describe deployment sdv-runtime || true
            fi
          else
            echo "SDV Runtime deployment not found - this might be expected"
            echo "Continuing with IVI interface startup..."
          fi
          
          # Final stability check before main container starts
          echo "Performing final system stability check..."
          sleep 10
          
          echo "Init container completed successfully"
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: dk-home
        hostPath: 
          path: /home/developer/.dk
          type: DirectoryOrCreate
      - name: x11-unix
        hostPath: 
          path: /tmp/.X11-unix
          type: Directory
      - name: dri
        hostPath: { path: /dev/dri }
      - name: kubectl-binary
        hostPath:
          path: /usr/local/bin/kubectl
          type: File
      - name: kube-config
        hostPath:
          path: /home/developer/.kube/config
          type: File
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-binary
        hostPath:
          path: /usr/bin/docker
          type: File
      containers:
      - name: dk-ivi
        image: ghcr.io/samtranbosch/dk_ivi:latest
        imagePullPolicy: IfNotPresent
        
        # Enhanced startup probe for sandbox issues
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'startup check' && sleep 2"]
          initialDelaySeconds: 45  # Longer delay for sandbox stability
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 12  # Allow 3 minutes for startup
        
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'ready'"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "echo 'alive'"]
          initialDelaySeconds: 120
          periodSeconds: 45
          timeoutSeconds: 15
          failureThreshold: 5
        
        # Resource limits to prevent resource exhaustion
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
        env:
        - name: DISPLAY
          value: ":0"
        - name: XDG_RUNTIME_DIR
          value: "/run/user/1000"
        - name: QT_QUICK_BACKEND
          value: "software"
        - name: DKCODE
          value: "dreamKIT"
        - name: DK_USER
          value: "developer"
        - name: DK_VIP
          value: ""
        - name: DK_DOCKER_HUB_NAMESPACE
          value: "ghcr.io/samtranbosch"
        - name: DK_ARCH
          value: "amd64"
        - name: DK_CONTAINER_ROOT
          value: "/app/.dk/"
        - name: KUBECONFIG
          value: "/root/.kube/config"
        volumeMounts:
        - name: dk-home
          mountPath: /app/.dk
        - name: x11-unix
          mountPath: /tmp/.X11-unix
        - name: dri
          mountPath: /dev/dri
        - name: kubectl-binary
          mountPath: /usr/local/bin/kubectl
          readOnly: true
        - name: kube-config
          mountPath: /root/.kube/config
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: docker-binary
          mountPath: /usr/bin/docker
          readOnly: true
